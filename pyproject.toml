[project]
name = "hashcons"
dynamic = ["version"]
authors = [{ name = "Hashberg" }]
description = "Hash consing for flyweight instance management."
readme = { file = "README.rst", content-type = "text/x-rst" }
requires-python = ">=3.15"
license = "LGPL-2.1-or-later"
license-files = ["LICENSE"]
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.15",
    "Natural Language :: English",
    "Typing :: Typed",
]

[project.urls]
Documentation = "https://hashcons.readthedocs.io"
Repository = "https://github.com/hashberg-io/hashcons"
Issues = "https://github.com/hashberg-io/hashcons/issues"

[build-system]
requires = ["hatchling == 1.30.1"]
build-backend = "hatchling.build"

[tool.black]
target-version = ["py315"]

[tool.mypy]
python_version = "3.15"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.version]
path = "src/hashcons/__init__.py"

[tool.hatch.build.targets.wheel]
only-include = ["src/hashcons"]
sources = ["src"]

[tool.hatch.build.targets.sdist]
only-include = ["src/hashcons", "tests", "README.rst", "LICENSE"]

[dependency-groups]
dev = ["mypy", "black", "pytest"]
